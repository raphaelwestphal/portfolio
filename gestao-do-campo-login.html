<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão do Campo — Login</title>
  <link rel="stylesheet" href="gestao-do-campo.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <!-- logo: folha + trator -->
      <svg class="login-logo" viewBox="0 0 96 64" fill="none">
        <path d="M32 8 C20 20 20 40 32 52 L32 8 Z" fill="#5a8a6a" opacity=".7"/>
        <path d="M32 8 C44 20 44 40 32 52" stroke="#5a8a6a" stroke-width="3" fill="none"/>
        <rect x="48" y="28" width="28" height="14" rx="4" fill="#5a8a6a"/>
        <circle cx="54" cy="46" r="6" fill="#5a8a6a"/>
        <circle cx="70" cy="46" r="6" fill="#5a8a6a"/>
      </svg>
      <h1>Gestão do Campo</h1>
      <p class="sub">Acesse sua conta</p>

      <p class="login-erro" id="loginErro">E-mail ou senha incorretos.</p>

      <form id="formLogin">
        <input type="email" id="inputEmail" placeholder="E-mail" required>
        <input type="password" id="inputSenha" placeholder="Senha" required>
        <button type="submit" class="btn-entrar">Entrar</button>
      </form>

      <a href="#" class="link">Esqueci minha senha</a>
      <p class="aviso">Não tem conta? Fale com o administrador</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
