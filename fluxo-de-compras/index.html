<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo de Compras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 3h18v4H3zM3 10h18v4H3zM3 17h18v4H3z"/>
            </svg>
            <span>Fluxo de <strong>Compras</strong></span>
        </div>
        
        <nav class="nav">
            <a href="#" class="active" data-tab="dashboard">Dashboard</a>
            <a href="#" data-tab="pedidos">Pedidos</a>
            <a href="#" data-tab="notas">Notas Fiscais</a>
            <a href="#" data-tab="estoque">Estoque Mínimo</a>
        </nav>

        <button class="theme-toggle" id="themeToggle" title="Alternar Tema">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
    </header>

    <main class="container">
        <div class="tab-content" id="tab-dashboard">
            <h2>Dashboard</h2>
            <p>Em breve: Visão geral dos indicadores.</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
